 40, "n": "Duke's Waikiki", "c": ["ビール・バー"], "lat": 21.2769032, "lng": -157.8278887, "d": "フラパイ(チョコクッキー生地にマカダミアナッツ・アイスクリームを高く盛り、ホットファッジをかけた名物デザート)", "a": "2335 Kalākaua Ave #116, Honolulu, HI 96815", "m": "https://www.google.com/maps/search/?api=1&query=Duke%27s%20Waikiki%202335%20Kal%C4%81kaua%20Ave%20%23116%2C%20Honolulu%2C%20HI%2096815", "u": "../north_america/usa/waikiki.html#c-dukes_waikiki", "food": "../north_america/usa/img/waikiki/dukes_waikiki.jpg", "ext": ""}, {"i": 41, "n": "Mai Tai Bar (The Royal Hawaiian)", "c": ["ビール・バー"], "lat": 21.276796599999997, "lng": -157.8287889, "d": "ロイヤル・マイタイ(ラム2種にオレンジキュラソー、オルジェー、パイナップルとオレンジの果汁を合わせた、この店発祥のカクテル)", "a": "2259 Kalākaua Ave, Honolulu, HI 96815", "m": "https://www.google.com/maps/search/?api=1&query=Mai%20Tai%20Bar%20%28The%20Royal%20Hawaiian%29%202259%20Kal%C4%81kaua%20Ave%2C%20Honolulu%2C%20HI%2096815", "u": "../north_america/usa/waikiki.html#c-mai_tai_bar_royal_hawaiian", "food": "../north_america/usa/img/waikiki/mai_tai_bar_royal_hawaiian.jpg", "ext": ""}, {"i": 42, "n": "Kani Ka Pila Grille", "c": ["ビール・バー"], "lat": 21.2784919, "lng": -157.8325577, "d": "ハワイ産食材のグリル料理とポケ(角切りの生魚を醤油やごま油で和えたハワイ料理)を、生演奏を聴きながら", "a": "2169 Kālia Rd, Honolulu, HI 96815", "m": "https://www.google.com/maps/search/?api=1&query=Kani%20Ka%20Pila%20Grille%202169%20K%C4%81lia%20Rd%2C%20Honolulu%2C%20HI%2096815", "u": "../north_america/usa/waikiki.html#c-kani_ka_pila_grille", "food": "../north_america/usa/img/waikiki/kani_ka_pila_grille.jpg", "ext": ""}, {"i": 43, "n": "Maui Brewing Co. Waikiki", "c": ["ビール・バー"], "lat": 21.2778778, "lng": -157.82720380000004, "d": "ビキニ・ブロンド・ラガー(マウイ醸造の軽やかな金色のラガー)とピザ(ハッピーアワーで$14)", "a": "2300 Kalākaua Ave, Honolulu, HI 96815", "m": "https://www.google.com/maps/search/?api=1&query=Maui%20Brewing%20Co.%20Waikiki%202300%20Kal%C4%81kaua%20Ave%2C%20Honolulu%2C%20HI%2096815", "u": "../north_america/usa/waikiki.html#c-maui_brewing_waikiki", "food": "../north_america/usa/img/waikiki/maui_brewing_waikiki.jpg", "ext": ""}, {"i": 44, "n": "House Without a Key", "c": ["ビール・バー"], "lat": 21.2774973, "lng": -157.8319393, "d": "ハレクラニ・マイタイ(ラム酒にオルジェー=アーモンドシロップと柑橘を合わせた同ホテル独自配合のカクテル)", "a": "2199 Kālia Rd #1936, Honolulu, HI 96815", "m": "https://www.google.com/maps/search/?api=1&query=House%20Without%20a%20Key%202199%20K%C4%81lia%20Rd%20%231936%2C%20Honolulu%2C%20HI%2096815", "u": "../north_america/usa/waikiki.html#c-house_without_a_key", "food": "../north_america/usa/img/waikiki/house_without_a_key.jpg", "ext": ""}, {"i": 45, "n": "Monkeypod Kitchen by Merriman (Waikiki)", "c": ["ビール・バー"], "lat": 21.277753999999998, "lng": -157.8331897, "d": "モンキーポッド・マイタイ(ラム酒に自家製マカダミアナッツ・オルジェーを合わせ、蜂蜜リリコイの泡を載せたカクテル)", "a": "2169 Kālia Rd Unit 111, Honolulu, HI 96815", "m": "https://www.google.com/maps/search/?api=1&query=Monkeypod%20Kitchen%20by%20Merriman%20%28Waikiki%29%202169%20K%C4%81lia%20Rd%20Unit%20111%2C%20Honolulu%2C%20HI%2096815", "u": "../north_america/usa/waikiki.html#c-monkeypod_kitchen_waikiki", "food": "../north_america/usa/img/waikiki/monkeypod_kitchen_waikiki.jpg", "ext": ""}];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- カテゴリの絞り込み（既定は全部オン） ---------------------------------
   1店が複数カテゴリを持つ（例: ご当地名物かつビール・バー）。
   **どちらのカテゴリで絞っても出る**ように、積ではなく和で判定する。 */
const CATS=[];
for(const k in CAT){ if(DATA.some(r=>r.c.includes(k))) CATS.push(k); }
const on=new Set(CATS);
const chips=document.getElementById('chips');
chips.innerHTML=CATS.map(k=>{
  const n=DATA.filter(r=>r.c.includes(k)).length;
  return `<button class="chip" data-cat="${esc(k)}" aria-pressed="true">`+
         `<span class="sw" style="background:${COLOR[CAT[k][0]]}"></span>${CAT[k][1]} ${esc(k)} <b>${n}</b></button>`;
}).join('')+'<button class="chip" id="c-all" aria-pressed="true">すべて</button>';

/* ---- 地図 ---------------------------------------------------------------- */
const pts=DATA.filter(r=>r.lat!=null);
const map=L.map('map',{zoomControl:true}).setView([21.279104,-157.828570],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const marks={};
for(const r of pts){
  const fam=CAT[r.c[0]]?CAT[r.c[0]][0]:'カフェ・酒場', gly=CAT[r.c[0]]?CAT[r.c[0]][1]:'•';
  const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14],
    html:`<div class="pin" style="background:${COLOR[fam]}">${gly}</div>`});
  let h=`<div class="pop"><h3>${esc(r.n)}</h3><p class="cat">${gly} ${esc(r.c.join(' / '))}</p>`;
  if(r.d) h+=`<p class="dish">${esc(r.d)}</p>`;
  if(r.food||r.ext){
    h+='<div class="imgs">';
    if(r.food) h+=`<figure><img loading="lazy" src="${esc(r.food)}" alt="${esc(r.n)}の料理"><figcaption>料理</figcaption></figure>`;
    if(r.ext) h+=`<figure><img loading="lazy" src="${esc(r.ext)}" alt="${esc(r.n)}の外観"><figcaption>外観</figcaption></figure>`;
    h+='</div>';
  }
  h+=`<p class="links"><a href="${esc(r.u)}">記事で読む</a>`+
     (r.m?`<a href="${esc(r.m)}" target="_blank" rel="noopener">Googleマップ</a>`:'')+'</p></div>';
  const mk=L.marker([r.lat,r.lng],{icon:icon,title:r.n}).bindPopup(h);
  marks[r.i]=mk;
}
if(pts.length) map.fitBounds(L.featureGroup(Object.values(marks)).getBounds().pad(0.05));

/* ---- 一覧（カテゴリごと・目次つき・検索つき） ------------------------------- */
const list=document.getElementById('list');
list.innerHTML='<div class="lhead"><input id="q" type="search" placeholder="店名・一皿・住所で探す" '+
  'autocomplete="off"><div class="toc" id="toc"></div></div><div id="grps"></div>';
const q=document.getElementById('q'), toc=document.getElementById('toc'), grps=document.getElementById('grps');

function shown(){
  const t=q.value.trim().toLowerCase();
  return DATA.filter(r=>{
    if(!r.c.some(c=>on.has(c))) return false;
    if(!t) return true;
    return (r.n+' '+r.d+' '+r.a+' '+r.c.join(' ')).toLowerCase().includes(t);
  });
}
function render(){
  const rs=shown();
  /* 複数カテゴリの店は**そのすべての見出しに出す**（利用者はどちらからも探すため） */
  const parts=[], tocp=[];
  for(const k of CATS){
    if(!on.has(k)) continue;
    const rows=rs.filter(r=>r.c.includes(k));
    if(!rows.length) continue;
    const id='g-'+CATS.indexOf(k);
    tocp.push(`<a href="#${id}">${CAT[k][1]} ${esc(k)} <b>${rows.length}</b></a>`);
    parts.push(`<section class="grp"><h2 id="${id}"><span class="sw" style="background:${COLOR[CAT[k][0]]}"></span>`+
      `${CAT[k][1]} ${esc(k)} <b>${rows.length}店</b></h2><table><tbody>`+
      rows.map(r=>`<tr><td class="nm">${esc(r.n)}</td><td>${esc(r.d)}</td><td class="ac">`+
        (r.lat!=null?`<button data-go="${r.i}">地図</button>`:'<span style="color:#9a9995;font-size:12px">座標なし</span>')+
        `<a href="${esc(r.u)}">記事</a>`+
        (r.m?`<a href="${esc(r.m)}" target="_blank" rel="noopener">MAP</a>`:'')+
        `</td></tr>`).join('')+'</tbody></table></section>');
  }
  toc.innerHTML=tocp.join('');
  grps.innerHTML=parts.length?parts.join(''):'<p class="empty">条件に合う店がありません。</p>';
}

/* ---- 表示の切り替えと配線 -------------------------------------------------- */
const bMap=document.getElementById('b-map'), bList=document.getElementById('b-list');
function view(v){
  const m=v==='map';
  document.getElementById('map').style.display=m?'block':'none';
  list.style.display=m?'none':'block';
  bMap.classList.toggle('on',m); bList.classList.toggle('on',!m);
  if(m) map.invalidateSize();
}
bMap.onclick=()=>view('map'); bList.onclick=()=>view('list');

function refresh(){
  for(const r of pts){
    const has=r.c.some(c=>on.has(c)), mk=marks[r.i];
    if(has && !map.hasLayer(mk)) mk.addTo(map);
    if(!has && map.hasLayer(mk)) map.removeLayer(mk);
  }
  render();
}
chips.onclick=e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  if(b.id==='c-all'){
    const all=on.size===CATS.length;
    on.clear(); if(!all) CATS.forEach(c=>on.add(c));
  }else{
    const k=b.dataset.cat;
    on.has(k)?on.delete(k):on.add(k);
  }
  for(const el of chips.querySelectorAll('.chip[data-cat]'))
    el.setAttribute('aria-pressed', on.has(el.dataset.cat)?'true':'false');
  document.getElementById('c-all').setAttribute('aria-pressed', on.size?'true':'false');
  refresh();
};
q.oninput=render;
grps.onclick=e=>{
  const b=e.target.closest('button[data-go]'); if(!b) return;
  const mk=marks[b.dataset.go]; if(!mk) return;
  view('map'); map.setView(mk.getLatLng(),17); mk.openPopup();
};
refresh(); view('map');
</script>
