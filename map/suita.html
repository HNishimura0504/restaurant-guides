../japan/osaka/img/suita/calore_exterior.jpg"}, {"i": 43, "n": "cuore ricco（クオーレ リッコ）", "c": ["洋食・各国料理"], "lat": 34.768622, "lng": 135.5081755, "d": "賞味期限5分のカルボナーラ（出来たての乳化が命の名物パスタ）", "a": "大阪府吹田市円山町６−３０", "m": "https://www.google.com/maps/search/?api=1&query=cuore%20ricco%EF%BC%88%E3%82%AF%E3%82%AA%E3%83%BC%E3%83%AC%20%E3%83%AA%E3%83%83%E3%82%B3%EF%BC%89%20%E5%A4%A7%E9%98%AA%E5%BA%9C%E5%90%B9%E7%94%B0%E5%B8%82%E5%86%86%E5%B1%B1%E7%94%BA%EF%BC%96%E2%88%92%EF%BC%93%EF%BC%90", "u": "../japan/osaka/suita.html#c-cuorericco", "food": "../japan/osaka/img/suita/cuorericco.jpg", "ext": "../japan/osaka/img/suita/cuorericco_exterior.jpg"}, {"i": 44, "n": "Le Porc（ル ポルク）", "c": ["洋食・各国料理"], "lat": 34.7916976, "lng": 135.54502589999998, "d": "イカとキャベツのペペロンチーノ（素材の旨みを活かした看板パスタ）", "a": "大阪府吹田市長野東１４−５", "m": "https://www.google.com/maps/search/?api=1&query=Le%20Porc%EF%BC%88%E3%83%AB%20%E3%83%9D%E3%83%AB%E3%82%AF%EF%BC%89%20%E5%A4%A7%E9%98%AA%E5%BA%9C%E5%90%B9%E7%94%B0%E5%B8%82%E9%95%B7%E9%87%8E%E6%9D%B1%EF%BC%91%EF%BC%94%E2%88%92%EF%BC%95", "u": "../japan/osaka/suita.html#c-leporc", "food": "../japan/osaka/img/suita/leporc.jpg", "ext": "../japan/osaka/img/suita/leporc_exterior.jpg"}, {"i": 45, "n": "手打ち蕎麦処 あき津", "c": ["麺類"], "lat": 34.797146999999995, "lng": 135.5117945, "d": "鴨汁蕎麦（香ばしい鴨の温かいつけ汁でいただく手打ち蕎麦）", "a": "大阪府吹田市高野台２丁目６−７−１", "m": "https://www.google.com/maps/search/?api=1&query=%E6%89%8B%E6%89%93%E3%81%A1%E8%95%8E%E9%BA%A6%E5%87%A6%20%E3%81%82%E3%81%8D%E6%B4%A5%20%E5%A4%A7%E9%98%AA%E5%BA%9C%E5%90%B9%E7%94%B0%E5%B8%82%E9%AB%98%E9%87%8E%E5%8F%B0%EF%BC%92%E4%B8%81%E7%9B%AE%EF%BC%96%E2%88%92%EF%BC%97%E2%88%92%EF%BC%91", "u": "../japan/osaka/suita.html#c-akitsu", "food": "../japan/osaka/img/suita/akitsu.jpg", "ext": ""}, {"i": 46, "n": "パン工房 アンジュリーク", "c": ["カフェ・パン・スイーツ"], "lat": 34.7652138, "lng": 135.5122508, "d": "ベーグル（サクッもちっの食感で リビング北摂も絶賛の看板商品）", "a": "大阪府吹田市出口町３０−１６", "m": "https://www.google.com/maps/search/?api=1&query=%E3%83%91%E3%83%B3%E5%B7%A5%E6%88%BF%20%E3%82%A2%E3%83%B3%E3%82%B8%E3%83%A5%E3%83%AA%E3%83%BC%E3%82%AF%20%E5%A4%A7%E9%98%AA%E5%BA%9C%E5%90%B9%E7%94%B0%E5%B8%82%E5%87%BA%E5%8F%A3%E7%94%BA%EF%BC%93%EF%BC%90%E2%88%92%EF%BC%91%EF%BC%96", "u": "../japan/osaka/suita.html#c-angelique", "food": "../japan/osaka/img/suita/angelique.jpg", "ext": "../japan/osaka/img/suita/angelique_exterior.jpg"}, {"i": 47, "n": "御菓子司 津村屋", "c": ["カフェ・パン・スイーツ"], "lat": 34.7628275, "lng": 135.529074, "d": "大阪産(おおさかもん)の和菓子（大阪素材にこだわった手作りのまんじゅう・大福類）", "a": "大阪府吹田市昭和町１４−１６", "m": "https://www.google.com/maps/search/?api=1&query=%E5%BE%A1%E8%8F%93%E5%AD%90%E5%8F%B8%20%E6%B4%A5%E6%9D%91%E5%B1%8B%20%E5%A4%A7%E9%98%AA%E5%BA%9C%E5%90%B9%E7%94%B0%E5%B8%82%E6%98%AD%E5%92%8C%E7%94%BA%EF%BC%91%EF%BC%94%E2%88%92%EF%BC%91%EF%BC%96", "u": "../japan/osaka/suita.html#c-tsumuraya", "food": "../japan/osaka/img/suita/tsumuraya.jpg", "ext": "../japan/osaka/img/suita/tsumuraya_exterior.jpg"}, {"i": 48, "n": "浪花食堂", "c": ["和食・郷土料理", "寿司・海鮮"], "lat": 34.7711221, "lng": 135.5287088, "d": "日替わり定食（ごはん・味噌汁におかずが付く昔ながらの食堂定食）", "a": "大阪府吹田市天道町１５−６", "m": "https://www.google.com/maps/search/?api=1&query=%E6%B5%AA%E8%8A%B1%E9%A3%9F%E5%A0%82%20%E5%A4%A7%E9%98%AA%E5%BA%9C%E5%90%B9%E7%94%B0%E5%B8%82%E5%A4%A9%E9%81%93%E7%94%BA%EF%BC%91%EF%BC%95%E2%88%92%EF%BC%96", "u": "../japan/osaka/suita.html#c-naniwashokudo", "food": "../japan/osaka/img/suita/naniwashokudo.jpg", "ext": "../japan/osaka/img/suita/naniwashokudo_exterior.jpg"}];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- カテゴリの絞り込み（既定は全部オン） ---------------------------------
   1店が複数カテゴリを持つ（例: ご当地名物かつビール・バー）。
   **どちらのカテゴリで絞っても出る**ように、積ではなく和で判定する。 */
const CATS=[];
for(const k in CAT){ if(DATA.some(r=>r.c.includes(k))) CATS.push(k); }
const on=new Set(CATS);
const chips=document.getElementById('chips');
chips.innerHTML=CATS.map(k=>{
  const n=DATA.filter(r=>r.c.includes(k)).length;
  return `<button class="chip" data-cat="${esc(k)}" aria-pressed="true">`+
         `<span class="sw" style="background:${COLOR[CAT[k][0]]}"></span>${CAT[k][1]} ${esc(k)} <b>${n}</b></button>`;
}).join('')+'<button class="chip" id="c-all" aria-pressed="true">すべて</button>';

/* ---- 地図 ---------------------------------------------------------------- */
const pts=DATA.filter(r=>r.lat!=null);
const map=L.map('map',{zoomControl:true}).setView([34.771020,135.515060],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const marks={};
for(const r of pts){
  const fam=CAT[r.c[0]]?CAT[r.c[0]][0]:'カフェ・酒場', gly=CAT[r.c[0]]?CAT[r.c[0]][1]:'•';
  const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14],
    html:`<div class="pin" style="background:${COLOR[fam]}">${gly}</div>`});
  let h=`<div class="pop"><h3>${esc(r.n)}</h3><p class="cat">${gly} ${esc(r.c.join(' / '))}</p>`;
  if(r.d) h+=`<p class="dish">${esc(r.d)}</p>`;
  if(r.food||r.ext){
    h+='<div class="imgs">';
    if(r.food) h+=`<figure><img loading="lazy" src="${esc(r.food)}" alt="${esc(r.n)}の料理"><figcaption>料理</figcaption></figure>`;
    if(r.ext) h+=`<figure><img loading="lazy" src="${esc(r.ext)}" alt="${esc(r.n)}の外観"><figcaption>外観</figcaption></figure>`;
    h+='</div>';
  }
  h+=`<p class="links"><a href="${esc(r.u)}">記事で読む</a>`+
     (r.m?`<a href="${esc(r.m)}" target="_blank" rel="noopener">Googleマップ</a>`:'')+'</p></div>';
  const mk=L.marker([r.lat,r.lng],{icon:icon,title:r.n}).bindPopup(h);
  marks[r.i]=mk;
}
if(pts.length) map.fitBounds(L.featureGroup(Object.values(marks)).getBounds().pad(0.05));

/* ---- 一覧（カテゴリごと・目次つき・検索つき） ------------------------------- */
const list=document.getElementById('list');
list.innerHTML='<div class="lhead"><input id="q" type="search" placeholder="店名・一皿・住所で探す" '+
  'autocomplete="off"><div class="toc" id="toc"></div></div><div id="grps"></div>';
const q=document.getElementById('q'), toc=document.getElementById('toc'), grps=document.getElementById('grps');

function shown(){
  const t=q.value.trim().toLowerCase();
  return DATA.filter(r=>{
    if(!r.c.some(c=>on.has(c))) return false;
    if(!t) return true;
    return (r.n+' '+r.d+' '+r.a+' '+r.c.join(' ')).toLowerCase().includes(t);
  });
}
function render(){
  const rs=shown();
  /* 複数カテゴリの店は**そのすべての見出しに出す**（利用者はどちらからも探すため） */
  const parts=[], tocp=[];
  for(const k of CATS){
    if(!on.has(k)) continue;
    const rows=rs.filter(r=>r.c.includes(k));
    if(!rows.length) continue;
    const id='g-'+CATS.indexOf(k);
    tocp.push(`<a href="#${id}">${CAT[k][1]} ${esc(k)} <b>${rows.length}</b></a>`);
    parts.push(`<section class="grp"><h2 id="${id}"><span class="sw" style="background:${COLOR[CAT[k][0]]}"></span>`+
      `${CAT[k][1]} ${esc(k)} <b>${rows.length}店</b></h2><table><tbody>`+
      rows.map(r=>`<tr><td class="nm">${esc(r.n)}</td><td>${esc(r.d)}</td><td class="ac">`+
        (r.lat!=null?`<button data-go="${r.i}">地図</button>`:'<span style="color:#9a9995;font-size:12px">座標なし</span>')+
        `<a href="${esc(r.u)}">記事</a>`+
        (r.m?`<a href="${esc(r.m)}" target="_blank" rel="noopener">MAP</a>`:'')+
        `</td></tr>`).join('')+'</tbody></table></section>');
  }
  toc.innerHTML=tocp.join('');
  grps.innerHTML=parts.length?parts.join(''):'<p class="empty">条件に合う店がありません。</p>';
}

/* ---- 表示の切り替えと配線 -------------------------------------------------- */
const bMap=document.getElementById('b-map'), bList=document.getElementById('b-list');
function view(v){
  const m=v==='map';
  document.getElementById('map').style.display=m?'block':'none';
  list.style.display=m?'none':'block';
  bMap.classList.toggle('on',m); bList.classList.toggle('on',!m);
  if(m) map.invalidateSize();
}
bMap.onclick=()=>view('map'); bList.onclick=()=>view('list');

function refresh(){
  for(const r of pts){
    const has=r.c.some(c=>on.has(c)), mk=marks[r.i];
    if(has && !map.hasLayer(mk)) mk.addTo(map);
    if(!has && map.hasLayer(mk)) map.removeLayer(mk);
  }
  render();
}
chips.onclick=e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  if(b.id==='c-all'){
    const all=on.size===CATS.length;
    on.clear(); if(!all) CATS.forEach(c=>on.add(c));
  }else{
    const k=b.dataset.cat;
    on.has(k)?on.delete(k):on.add(k);
  }
  for(const el of chips.querySelectorAll('.chip[data-cat]'))
    el.setAttribute('aria-pressed', on.has(el.dataset.cat)?'true':'false');
  document.getElementById('c-all').setAttribute('aria-pressed', on.size?'true':'false');
  refresh();
};
q.oninput=render;
grps.onclick=e=>{
  const b=e.target.closest('button[data-go]'); if(!b) return;
  const mk=marks[b.dataset.go]; if(!mk) return;
  view('map'); map.setView(mk.getLatLng(),17); mk.openPopup();
};
refresh(); view('map');
</script>
