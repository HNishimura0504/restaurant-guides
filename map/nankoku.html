const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- カテゴリの絞り込み（既定は全部オン） ---------------------------------

const CATS=[];
for(const k in CAT){ if(DATA.some(r=>r.c.includes(k))) CATS.push(k); }
const on=new Set(CATS);
const chips=document.getElementById('chips');
chips.innerHTML=CATS.map(k=>{
  const n=DATA.filter(r=>r.c.includes(k)).length;
  return `<button class="chip" data-cat="${esc(k)}" aria-pressed="true" `+
         `title="1回で切り替え / 2回続けて押すとこのカテゴリだけ">`+
         `<span class="sw" style="background:${COLOR[CAT[k][0]]}"></span>${esc(k)} <b>${n}</b></button>`;
}).join('')+'<button class="chip" id="c-all" aria-pressed="true">すべて</button>';
/* ---- 業態の凡例（ピンの絵文字。2026-09-26 ユーザー指示の6種・強い順） ---- */

const marks={};
for(const r of pts){
  const fam=CAT[r.c[0]]?CAT[r.c[0]][0]:'カフェ・酒場', gly=VENUE[r.v]||'🍴';
  const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14],
    html:`<div class="pin" style="background:${COLOR[fam]}">${gly}</div>`});
  let h=`<div class="pop"><h3>${esc(r.n)}</h3><p class="cat">${gly} ${esc(r.v||'')} ・ ${esc(r.c.join(' / '))}</p>`;
  if(r.d) h+=`<p class="dish">${esc(r.d)}</p>`;
  if(r.food||r.ext){
    h+='<div class="imgs">';
    if(r.food) h+=`<figure><img loading="lazy" src="${esc(r.food)}" alt="${esc(r.n)}の料理"><figcaption>料理</figcaption></figure>`;
    if(r.ext) h+=`<figure><img loading="lazy" src="${esc(r.ext)}" alt="${esc(r.n)}の外観"><figcaption>外観</figcaption></figure>`;
    h+='</div>';
  }
  h+=`<p class="links"><a href="${esc(r.u)}">記事で読む</a>`+
     (r.m?`<a href="${esc(r.m)}" target="_blank" rel="noopener">Googleマップ</a>`:'')+'</p></div>';
  const mk=L.marker([r.lat,r.lng],{icon:icon,title:r.n}).bindPopup(h);
  marks[r.i]=mk;
}
if(pts.length) map.fitBounds(L.featureGroup(Object.values(marks)).getBounds().pad(0.05));

/* ---- 一覧（カテゴリごと・目次つき・検索つき） ------------------------------- */
const list=document.getElementById('list');
list.innerHTML='<div class="lhead"><input id="q" type="search" placeholder="店名・一皿・住所で探す" '+
  'autocomplete="off"><div class="toc" id="toc"></div></div><div id="grps"></div>';
const q=document.getElementById('q'), toc=document.getElementById('toc'), grps=document.getElementById('grps');

function shown(){
  const t=q.value.trim().toLowerCase();
  return DATA.filter(r=>{
    if(!r.c.some(c=>on.has(c))) return false;
    if(!t) return true;
    return (r.n+' '+r.d+' '+r.a+' '+r.c.join(' ')).toLowerCase().includes(t);
  });
}
function render(){
  const rs=shown();
  /* 複数カテゴリの店は**そのすべての見出しに出す**（利用者はどちらからも探すため） */
  const parts=[], tocp=[];
  for(const k of CATS){
    if(!on.has(k)) continue;
    const rows=rs.filter(r=>r.c.includes(k));
    if(!rows.length) continue;
    const id='g-'+CATS.indexOf(k);
    tocp.push(`<a href="#${id}">${esc(k)} <b>${rows.length}</b></a>`);
    parts.push(`<section class="grp"><h2 id="${id}"><span class="sw" style="background:${COLOR[CAT[k][0]]}"></span>`+
      `${esc(k)} <b>${rows.length}店</b></h2><table><tbody>`+
      rows.map(r=>`<tr><td class="nm">${VENUE[r.v]||''} ${esc(r.n)}</td><td>${esc(r.d)}</td><td class="ac">`+
        (r.lat!=null?`<button data-go="${r.i}">地図</button>`:'<span style="color:#9a9995;font-size:12px">座標なし</span>')+
        `<a href="${esc(r.u)}">記事</a>`+
        (r.m?`<a href="${esc(r.m)}" target="_blank" rel="noopener">MAP</a>`:'')+
        `</td></tr>`).join('')+'</tbody></table></section>');
  }
  toc.innerHTML=tocp.join('');
  grps.innerHTML=parts.length?parts.join(''):'<p class="empty">条件に合う店がありません。</p>';
}

/* ---- 表示の切り替えと配線 -------------------------------------------------- */
const bMap=document.getElementById('b-map'), bList=document.getElementById('b-list');
function view(v){
  const m=v==='map';
  document.getElementById('map').style.display=m?'block':'none';
  list.style.display=m?'none':'block';
  bMap.classList.toggle('on',m); bList.classList.toggle('on',!m);
  if(m) map.invalidateSize();
}
bMap.onclick=()=>view('map'); bList.onclick=()=>view('list');

function refresh(){
  for(const r of pts){
    const has=r.c.some(c=>on.has(c)), mk=marks[r.i];
    if(has && !map.hasLayer(mk)) mk.addTo(map);
    if(!has && map.hasLayer(mk)) map.removeLayer(mk);
  }
  render();
}
/* ---- 絞り込みチップの操作 --------------------------------------------------
   1回＝そのカテゴリを足す/外す。**2回続けて押す＝そのカテゴリだけにする**
   （ユーザー依頼 2026-09-20「地図ページのフィルタダブルタップでそれだけ選択
   他選択解除できるようにしてくれ」）。すでにそれ1つだけなら、もう一度の
   ダブルタップで全部に戻す（単独にした人が元へ戻る道を持てるように）。

   **1回目の切り替えを打ち消してから単独にする**のが要点。打ち消さずに足し引きで
   組み立てると、「1回目で消える → 2回目で自分だけ」の順になり、
   **指の速さで結果が変わる**（押した順は同じなのに、間隔が空くと単に消える）。
   `on.clear()` から組み直せば、2回目の時点の状態は間隔によらず1つに定まる。

   `dblclick` を使わない理由: スマホの Safari は要素によって `dblclick` を出さず、
   出しても `click` 2回の**後**に来るので、上の「打ち消し」が1手遅れる。
   時刻の差（400ms）で自前に判定するほうが、PCでも端末でも同じ道を通る。 */
let lastK=null, lastT=0, before=null;
chips.onclick=e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  const k=b.dataset.cat, t=Date.now();
  const dbl=(k && k===lastK && t-lastT<400);
  /* **2回で1組として数え直す**。`lastT=t` のままにすると3回目・4回目が前の組と鎖に
     なり、同じ押し方でも間隔しだいで結果が変わる（実測＝3回目が「単独→全部戻す」を
     引き継いで1種になった）。組が成立したら時計を捨てる。 */
  lastK=k||null; lastT=dbl?0:t;
  if(!dbl) before=new Set(on);   /* 組が始まる前の状態を控える（下で使う） */
  if(dbl){
    /* 「すでにこれ1つだけか」は、**組が始まる前**の状態で判定する。
       いまの `on` は1回目のタップで既に動いており（単独状態なら空になっている）、
       それを見ると「1つだけ」を取り逃す（実測＝戻す操作が効かなかった）。 */
    const solo=(before.size===1 && before.has(k));
    on.clear();
    if(solo) CATS.forEach(c=>on.add(c)); else on.add(k);
  }else if(b.id==='c-all'){
    const all=on.size===CATS.length;
    on.clear(); if(!all) CATS.forEach(c=>on.add(c));
  }else{
    on.has(k)?on.delete(k):on.add(k);
  }
  for(const el of chips.querySelectorAll('.chip[data-cat]'))
    el.setAttribute('aria-pressed', on.has(el.dataset.cat)?'true':'false');
  document.getElementById('c-all').setAttribute('aria-pressed', on.size?'true':'false');
  refresh();
};
q.oninput=render;
grps.onclick=e=>{
  const b=e.target.closest('button[data-go]'); if(!b) return;
  const mk=marks[b.dataset.go]; if(!mk) return;
  view('map'); map.setView(mk.getLatLng(),17); mk.openPopup();
};
refresh(); view('map');

(function(){
  var K='rg-last-map';
  window.__snRemember=function(slug,city){
    try{ localStorage.setItem(K, JSON.stringify({s:slug,c:city})); }catch(e){}
  };
  window.__snLast=function(){
    try{ var v=JSON.parse(localStorage.getItem(K)||'null');
         return (v&&v.s)?v:null; }catch(e){ return null; }
  };
  function menu(){ return document.querySelector('.snavm'); }
  function open(v){
    var m=menu(); if(!m) return;
    m.classList.toggle('on', v);
    document.body.style.overflow = v ? 'hidden' : '';
    var b=document.querySelector('.sn-bg');
    if(b) b.setAttribute('aria-expanded', v?'true':'false');
  }
  document.addEventListener('click', function(e){
    var t=e.target;
    if(!t.closest) return;
    if(t.closest('.sn-bg')){ e.preventDefault(); open(!menu().classList.contains('on')); return; }
    if(t.closest('.sn-ov')||t.closest('.sn-x')){ open(false); return; }
    /* 表示切替は menu を開いたまま（切替結果をその場で見せる）。他の項目は閉じる。 */
    if(t.closest('.snavm') && !t.closest('.vmsw')) open(false);
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') open(false); });
})();

(function(){
  var K='rg-view-mode', order=['auto','phone','pc'];
  var label={auto:'\u8868\u793a: \u81ea\u52d5', phone:'\u8868\u793a: \u30b9\u30de\u30db', pc:'\u8868\u793a: PC'};
  function get(){ try{ var v=localStorage.getItem(K); return order.indexOf(v)>=0?v:'auto'; }catch(e){ return 'auto'; } }
  function set(v){ try{ localStorage.setItem(K,v); }catch(e){} }
  function vp(){
    var m=document.querySelector('meta[name=viewport]');
    if(!m){ m=document.createElement('meta'); m.name='viewport'; document.head.appendChild(m); }
    return m;
  }
  function apply(v){
    var h=document.documentElement;
    h.classList.remove('vm-phone','vm-pc');
    if(v==='phone') h.classList.add('vm-phone');
    if(v==='pc') h.classList.add('vm-pc');
    vp().setAttribute('content', v==='pc' ? 'width=1100' : 'width=device-width, initial-scale=1');
    var b=document.querySelector('.vmsw');
    if(b){ b.textContent=label[v]; b.setAttribute('aria-label', label[v]+'\uff08\u62bc\u3059\u3068\u5207\u308a\u66ff\u308f\u308a\u307e\u3059\uff09'); }
  }
  window.__rgApply=apply;
  apply(get());
  document.addEventListener('click', function(e){
    var b=e.target.closest ? e.target.closest('.vmsw') : null;
    if(!b) return;
    var v=order[(order.indexOf(get())+1)%order.length];
    set(v); apply(v);
  });
})();
