name: 地図を GitHub Pages へ公開

# notion/build_map.py で都市ごとの地図ページを作り、GitHub Pages で公開する。
# Notion からはこの URL を埋め込む。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "notion/build_map.py"
      - "notion/stores.json"
      - "notion/vendor/**"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 地図ページを作る
        run: python notion/build_map.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
