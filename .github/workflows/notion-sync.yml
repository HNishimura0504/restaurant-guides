name: Notion 本文化（写真つき）

# 毎晩 02:00 JST に走らせ、未処理のガイドを進める。
# 途中まで済んでいれば続きから。全部終わっていれば何もせず終わる。
# 【2026-09-26 停止】2026-09-17 のユーザー決定「Notionではなく web サイトに変える」
# （ai-memory: topics/restaurant-guides/log/notion_map_embed_2026.md §20-6・B-474／記録 B-608）により、
# 夜間の自動実行を止める。手動（workflow_dispatch）は残す＝再開の判断はユーザーが行う。
# 停止前の実績: 2026-09-24・09-25 とも failure（決定後も毎晩走って失敗していた）。
on:
  workflow_dispatch:
    inputs:
      limit_images:
        description: "1回で上げる画像の上限（0＝無制限で最後までやる）"
        required: false
        default: "0"
      dry_run:
        description: "1 なら Notion に書き込まず検証だけ"
        required: false
        default: "0"
      only:
        description: "この文字列を含むガイドだけ処理する（例: japan_osaka_suita）。空なら全部"
        required: false
        default: ""

concurrency:
  group: notion-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存を入れる
        run: pip install --quiet requests pillow

      - name: 本文Markdownを作り直す（HTMLが正・差分があれば反映）
        run: python notion/build_md.py

      - name: Notion へ同期
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ vars.NOTION_DB_ID }}
          LIMIT_IMAGES: ${{ github.event.inputs.limit_images || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: python notion/sync.py

      - name: 進捗をコミットして戻す
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notion/state/upload_state.json notion/map.tsv notion/guides_md notion/img_manifest.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "notion-sync: 進捗を更新 [skip ci]"
            git push
          fi
