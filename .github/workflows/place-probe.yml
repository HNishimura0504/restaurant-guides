name: 場所プロパティの書き込み検査

# 公開 Notion API で place プロパティに書けるかを1回だけ測るための使い捨てワークフロー。
# 結果が出たら削除してよい。
on:
  workflow_dispatch:
    inputs:
      page_id:
        description: "書き込み先の店舗DBの行のページID"
        required: true
        default: "3c1ac134b5ce81138348e02acd8d5659"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: 検査
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROBE_PAGE_ID: ${{ github.event.inputs.page_id }}
        run: python notion/place_probe.py
